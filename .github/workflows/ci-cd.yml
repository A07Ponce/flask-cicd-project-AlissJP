name: CI/CD Pipeline (ponce)

on:
  push:
    branches:
      - ponce

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q

      - name: Set image name and tag
        run: |
          echo "IMAGE_NAME=ghcr.io/${{ github.actor }}/ponce" >> $GITHUB_ENV
          echo "IMAGE_TAG=1.0.5" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG

      - name: Prepare docker-compose for VPS
        run: |
          cat > deploy-docker-compose.yml <<EOF
version: "3.9"
services:
  flask-app:
    image: $IMAGE_NAME:$IMAGE_TAG
    container_name: flask_app_ponce
    ports:
      - "80:5000"
    restart: always
EOF

      - name: Copy docker-compose to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "$VPS_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          scp -i private_key.pem -o StrictHostKeyChecking=no deploy-docker-compose.yml $VPS_USER@$VPS_HOST:/home/$VPS_USER/docker-compose.yml

      - name: Deploy on VPS (pull and restart)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "$VPS_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          ssh -i private_key.pem -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "docker compose pull && docker compose up -d"
