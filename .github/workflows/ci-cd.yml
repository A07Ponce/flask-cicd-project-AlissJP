# Nombre del flujo de trabajo
name: CI/CD Pipeline (Ponce - Corregido)

# Evento que dispara el flujo de trabajo: push a la rama 'ponce'
on:
  push:
    branches:
      - ponce

jobs:
  build-and-deploy:
    # Ejecutar en un corredor de Ubuntu (máquina virtual)
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout del código
      - name: Checkout repo
        uses: actions/checkout@v4
      
      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      
      # 3. Debug: Listar archivos del proyecto
      - name: Debug - List files
        run: |
          echo "Contenido del repositorio:"
          ls -la
          echo "---"
          if [ -f "requirements.txt" ]; then
            echo "requirements.txt encontrado:"
            cat requirements.txt
          else
            echo "No hay requirements.txt"
          fi
      
      # 4. Instalar dependencias (con manejo de errores)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt, instalando Flask por defecto"
            pip install flask
          fi
      
      # 5. Verificar si hay tests (opcional)
      - name: Check and run tests
        run: |
          # Verificar si pytest está disponible y hay tests
          if python -c "import pytest" &>/dev/null; then
            echo "pytest está instalado"
            if [ -d "tests" ] || ls test_*.py &>/dev/null || ls *_test.py &>/dev/null; then
              echo "Ejecutando tests..."
              pytest -v
            else
              echo "No se encontraron archivos de test, omitiendo tests"
            fi
          else
            echo "pytest no está instalado, omitiendo tests"
          fi
      
      # 6. Establecer variables de entorno para Docker
      - name: Set image name and tag
        run: |
          echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/ponce-app" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "Image: ghcr.io/${{ github.repository_owner }}/ponce-app:${{ github.sha }}"

      # 7. Verificar Dockerfile
      - name: Check Dockerfile
        run: |
          if [ -f "Dockerfile" ]; then
            echo "Dockerfile encontrado:"
            cat Dockerfile
          else
            echo "ERROR: No se encontró Dockerfile"
            exit 1
          fi
      
      # 8. Login en GHCR
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 9. Build de la imagen Docker
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
      
      # 10. Push de la imagen Docker
      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG

      # 11. Preparar archivo docker-compose de despliegue
      - name: Prepare docker-compose for VPS
        run: |
          echo 'version: "3.9"' > deploy-docker-compose.yml
          echo 'services:' >> deploy-docker-compose.yml
          echo '  flask-app:' >> deploy-docker-compose.yml
          echo '    image: '"$IMAGE_NAME"':'"$IMAGE_TAG" >> deploy-docker-compose.yml
          echo '    container_name: flask_app_ponce' >> deploy-docker-compose.yml
          echo '    ports:' >> deploy-docker-compose.yml
          echo '      - "80:5000"' >> deploy-docker-compose.yml
          echo '    restart: always' >> deploy-docker-compose.yml
          echo "Contenido de deploy-docker-compose.yml:"
          cat deploy-docker-compose.yml
      
      # 12. CONFIGURACIÓN DE SSH
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      
      # 13. Test SSH connection
      - name: Test SSH connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          echo "Probando conexión SSH a $VPS_USER@$VPS_HOST"
          ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "echo 'Conexión SSH exitosa' && docker --version"
      
      # 14. Copiar el archivo docker-compose
      - name: Copy docker-compose to VPS via SCP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -o StrictHostKeyChecking=no deploy-docker-compose.yml $VPS_USER@$VPS_HOST:/home/$VPS_USER/docker-compose.yml

      # 15. Despliegue en el VPS
      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "cd /home/$VPS_USER && docker compose pull && docker compose up -d"
