# Nombre del flujo de trabajo
name: CI/CD Pipeline (Ponce - Corregido)

# Evento que dispara el flujo de trabajo: push a la rama 'ponce'
on:
  push:
    branches:
      - ponce

jobs:
  build-and-deploy:
    # Ejecutar en un corredor de Ubuntu (máquina virtual)
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout del código
      - name: Checkout repo
        uses: actions/checkout@v4
      
      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      
      # 3. Instalar dependencias y ejecutar tests
      - name: Install dependencies and Run tests
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Asegúrese de que los tests pasen antes de continuar
          pytest -q
      
      # 4. Establecer variables de entorno para Docker
      - name: Set image name and tag
        run: |
          echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/ponce-app" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      # 5. Login en GHCR
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Build y Push de la imagen Docker
      - name: Build and Push Docker image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker push $IMAGE_NAME:$IMAGE_TAG
      
      # 7. Preparar archivo docker-compose de despliegue
      - name: Prepare docker-compose for VPS
        run: |
          cat > deploy-docker-compose.yml <<EOF
version: "3.9"
services:
  flask-app:
    image: $IMAGE_NAME:$IMAGE_TAG
    container_name: flask_app_ponce
    ports:
      - "80:5000"
    restart: always
EOF
      
      # 8. CONFIGURACIÓN DE SSH (Utiliza un agente para evitar errores de archivo)
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      
      # 9. Copiar el archivo docker-compose
      - name: Copy docker-compose to VPS via SCP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -o StrictHostKeyChecking=no deploy-docker-compose.yml $VPS_USER@$VPS_HOST:/home/$VPS_USER/docker-compose.yml

      # 10. Despliegue en el VPS (pull y restart)
      - name: Deploy on VPS (pull and restart)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "docker compose pull && docker compose up -d"
